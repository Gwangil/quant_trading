# 자동 생성 (qtrade make-configs). 수정은 src/qtrade/profiles.py 에서.
# 균형형(기본): 슬라이스 6, 매수 하락률 0.25σ, 상승일 부분매도 10%
# 데이터: cache (SOXL/SOXX, csv)
name: soxl_balanced_cache
initial_capital: 100000
cash_yield_annual: TBILL3M
cash_yield_fraction: 0.8
cash_yield_spread: -0.0015
data:
  symbol: SOXL
  reference: SOXX
  source: csv
  cache_dir: data/cache
  bundled_dir: data/bundled
  start: null
  end: null
  synthetic: null
  backfill: false
baskets:
  count: 4
  slices: 6
  min_days_between_opens: 3
  min_budget_frac: 0.25
  budget_mode: equity
entry:
  vol_window: 20
  dip_vol_mult: 0.25
  min_dip_pct: 0.0
  max_dip_pct: 0.06
  first_slice_dip_pct: 0.0
  max_slice_mult: 3.0
  target_vol: 0.045
exit:
  lot_tp_vol_mult: 1.0
  min_lot_tp_pct: 0.03
  max_lot_tp_pct: 0.15
  upday_sell_frac: 0.1
  basket_tp_pct: 0.2
  basket_sl_pct: null
  max_hold_days: 60
  hard_max_hold_days: 120
  soft_exit_pnl_pct: 0.0
regime:
  enabled: true
  ma_window: 200
  ma_band: 0.0
  bear_max_baskets: 1
  bear_slice_mult: 0.5
  bear_liquidate: true
  cooldown_after_sl_days: 20
  breaker_dd: null
  breaker_resume_sma: 200
costs:
  commission_pct: 0.001
  slippage_pct: 0.0
  integer_shares: false
kind: basket_loc
