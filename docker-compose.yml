version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    environment:
      POSTGRES_DB: quant_trading
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: quant_timescale
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: timescale_user
      POSTGRES_PASSWORD: timescale_pass
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - quant_network

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quant_network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: quant_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quant_network

  # Data Collection Service
  data_collector:
    build: ./services/data_collector
    container_name: quant_data_collector
    environment:
      DATABASE_URL: postgresql://timescale_user:timescale_pass@timescaledb:5432/market_data
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
    depends_on:
      - timescaledb
      - redis
      - rabbitmq
    volumes:
      - ./services/data_collector:/app
      - ./shared:/shared
    networks:
      - quant_network

  # Strategy Engine
  strategy_engine:
    build: ./services/strategy_engine
    container_name: quant_strategy_engine
    environment:
      DATABASE_URL: postgresql://quant_user:quant_pass@postgres:5432/quant_trading
      TIMESCALE_URL: postgresql://timescale_user:timescale_pass@timescaledb:5432/market_data
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
    depends_on:
      - postgres
      - timescaledb
      - redis
      - rabbitmq
    volumes:
      - ./services/strategy_engine:/app
      - ./shared:/shared
    networks:
      - quant_network

  # Backtesting Service
  backtesting:
    build: ./services/backtesting
    container_name: quant_backtesting
    environment:
      DATABASE_URL: postgresql://quant_user:quant_pass@postgres:5432/quant_trading
      TIMESCALE_URL: postgresql://timescale_user:timescale_pass@timescaledb:5432/market_data
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - timescaledb
      - redis
    volumes:
      - ./services/backtesting:/app
      - ./shared:/shared
    networks:
      - quant_network

  # Order Generator
  order_generator:
    build: ./services/order_generator
    container_name: quant_order_generator
    environment:
      DATABASE_URL: postgresql://quant_user:quant_pass@postgres:5432/quant_trading
      TIMESCALE_URL: postgresql://timescale_user:timescale_pass@timescaledb:5432/market_data
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
    depends_on:
      - postgres
      - timescaledb
      - redis
      - rabbitmq
    volumes:
      - ./services/order_generator:/app
      - ./shared:/shared
    networks:
      - quant_network

  # API Gateway
  api_gateway:
    build: ./services/api_gateway
    container_name: quant_api_gateway
    environment:
      DATABASE_URL: postgresql://quant_user:quant_pass@postgres:5432/quant_trading
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/api_gateway:/app
      - ./shared:/shared
    networks:
      - quant_network

  # Admin UI
  admin_ui:
    build: ./services/admin_ui
    container_name: quant_admin_ui
    environment:
      API_URL: http://api_gateway:8000
    ports:
      - "3000:3000"
    depends_on:
      - api_gateway
    volumes:
      - ./services/admin_ui:/app
    networks:
      - quant_network

networks:
  quant_network:
    driver: bridge

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  rabbitmq_data: